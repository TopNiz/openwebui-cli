name: Bug report
description: Report reproducible incorrect behavior
title: "bug: "
labels: ["type: bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include API keys, passwords, JWTs, cookies, personal data, or private deployment details."
  - type: input
    id: version
    attributes:
      label: CLI and Open WebUI versions
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
